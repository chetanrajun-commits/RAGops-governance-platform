[project]
name = "ragops-governance-platform"
version = "0.1.0"
description = "An enterprise RAG pipeline that enforces chunk-level RBAC, simulates LLM-as-a-Judge evaluations, and produces deterministic audit logs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chetan Raju" }]
keywords = ["genai", "rag", "responsible-ai", "rbac", "governance"]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
ragops = "ragops.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
